name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (astro check + astro build)
        uses: withastro/action@v6
        with:
          node-version: 22.23.5
          package-manager: npm
        env:
          # Po přepnutí na vlastní doménu nastavte proměnné repozitáře SITE a BASE
          # (Settings → Secrets and variables → Actions → Variables).
          SITE: ${{ vars.SITE || 'https://ctu-ve-meste.github.io' }}
          BASE: ${{ vars.BASE || '/web' }}
          PUBLIC_APPS_SCRIPT_URL: ${{ vars.PUBLIC_APPS_SCRIPT_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení
        id: deployment
        uses: actions/deploy-pages@v5
