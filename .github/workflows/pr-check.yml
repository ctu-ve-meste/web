name: Kontrola pull requestu

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (astro check + astro build, chyba v obsahu build shodí)
        run: npm run build
      - name: Kontrola interních odkazů
        run: npm run kontrola-odkazu
      - name: Kontrola přesměrování ze starého webu
        run: npm run kontrola-presmerovani
      - name: Náhled webu ke stažení (rozbalit, pak npm run preview nebo otevřít přes lokální server)
        uses: actions/upload-artifact@v4
        with:
          name: nahled-webu
          path: dist
          retention-days: 14
